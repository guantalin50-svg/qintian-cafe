<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>欽天咖啡廳</title>
<style>
:root{color-scheme:dark;--bg:#221914;--panel:#2e221a;--border:#554033;--ink:#fae9cd;--muted:#c5ab91;--green:#b5d197;--accent:#f5c982;--rose:#ffc09a}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at 22% 0%,#403025,transparent 52%),var(--bg);color:var(--ink);font-family:system-ui,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
main{max-width:1390px;margin:auto;padding:clamp(14px,3vw,38px)}
header{padding:0 0 20px;border-bottom:1px solid var(--border);margin-bottom:20px;display:flex;justify-content:space-between;gap:16px;align-items:end;flex-wrap:wrap}
h1{margin:0;font-size:clamp(26px,4vw,46px);letter-spacing:.09em;line-height:1.2}
h2{font-size:17px;margin:0;letter-spacing:.08em}
.clock{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.clock time{font-size:20px;color:var(--ink);margin-left:8px}
.flags{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
.chip{border:1px solid var(--border);font-size:12px;padding:4px 9px;border-radius:4px;color:var(--muted)}
.open{color:var(--green)}.alert{color:var(--rose)}
.layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(260px,320px);gap:18px;align-items:start}
.frame{padding:5px;border:1px solid #775840;background:#39271c;border-radius:8px;box-shadow:0 14px 25px #160e0a60}
.scene{position:relative;aspect-ratio:456/300;isolation:isolate;background:#583e32}
canvas{display:block;width:100%;height:100%;image-rendering:pixelated;border-radius:3px}
.chalk{position:absolute;left:36.8%;top:9.8%;width:20%;text-align:center;font-weight:800;letter-spacing:.12em;font-size:clamp(7px,1.5vw,16px);color:#efdab4;white-space:nowrap;pointer-events:none}
.targets{position:absolute;inset:0;pointer-events:none}
.person{position:absolute;transform:translate(-50%,-90%);height:30px;min-width:34px;padding:0;border:0;background:transparent;color:var(--ink);pointer-events:auto;cursor:pointer}
.person:focus-visible,.crew button:focus-visible{outline:2px solid var(--accent)}
.nametag{position:absolute;top:100%;left:50%;transform:translateX(-50%);background:#211813ef;color:#fff0d6;padding:1px 4px;border-radius:2px;font-size:clamp(8px,1.15vw,11px);white-space:nowrap}
.person[aria-pressed=true] .nametag{background:#f1ca88;color:#372619}
.bubble{display:none;position:absolute;z-index:2;pointer-events:none;left:var(--x);top:var(--y);transform:translate(-50%,-100%);width:max-content;max-width:min(168px,40%);padding:6px 8px;border:1px solid #5b3b2e;border-radius:5px;background:#fff2d3;color:#3b261e;box-shadow:2px 3px #27190e65;font-size:clamp(9px,1.35vw,12px);line-height:1.35}
.bubble::after{content:"";position:absolute;top:100%;left:var(--tip,50%);border:4px solid transparent;border-top-color:#fff2d3;transform:translateX(-50%)}
.bubble.show{display:block}.bubble.focus{z-index:3;border-color:#c88036}
.crew{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.crew button{font:inherit;font-size:12px;color:var(--ink);background:var(--panel);border:1px solid var(--border);border-radius:4px;padding:6px 8px;cursor:pointer;display:flex;align-items:center;gap:6px}
.crew button[aria-pressed=true]{border-color:var(--accent);background:#4d3523}
.swatch{height:8px;width:8px;background:var(--color);box-shadow:2px 2px #150e0a}
.panel{border:1px solid var(--border);border-radius:8px;background:var(--panel);overflow:hidden}
.panel-head{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:8px}
.snapshot{color:var(--muted);font-size:11px;white-space:nowrap}
#notice{margin:0;font-size:13px;color:var(--rose);padding:12px 16px;border-bottom:1px solid var(--border)}
#feed{list-style:none;padding:0;margin:0;max-height:clamp(240px,46vw,590px);overflow:auto;scrollbar-color:#805a40 var(--panel)}
#feed li{padding:9px 15px;border-bottom:1px solid #4a372a;overflow-wrap:anywhere}
#feed li.mark{background:#4d3727;box-shadow:inset 3px 0 var(--accent)}
.event-meta{display:flex;align-items:center;gap:10px;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.event-meta strong{color:var(--accent);font-weight:600}
.event-text,.empty{font-size:13px;line-height:1.5;margin:3px 0 0}
#selection{font-size:13px;color:var(--ink);padding:10px 12px;border-left:2px solid var(--accent);margin:12px 0 0;background:var(--panel)}
body.night{--bg:#1a1823;--panel:#25212d;--border:#514154}
@media(max-width:900px){.layout{grid-template-columns:minmax(0,1fr)}#feed{max-height:360px}}
@media(max-width:520px){.bubble.ambient{display:none}.person{height:24px;min-width:28px}.nametag{padding:0 2px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
#app[hidden],#gate[hidden]{display:none!important}
#gate{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:28px 18px}
.gate-card{width:min(100%,420px);background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:28px 22px 24px;box-shadow:0 16px 32px #160e0a70}
.gate-card h1{font-size:clamp(28px,8vw,40px);margin:0 0 8px}
.gate-card p{margin:0 0 18px;color:var(--muted);font-size:15px;line-height:1.55}
.gate-card label{display:block;font-size:13px;margin-bottom:6px;color:var(--muted)}
.gate-card input{width:100%;font:inherit;font-size:16px;line-height:1.4;padding:12px 12px;border-radius:8px;border:1px solid var(--border);background:#1b1410;color:var(--ink);margin-bottom:14px}
.gate-card button{width:100%;font:inherit;font-size:17px;font-weight:700;padding:13px 12px;border:0;border-radius:8px;background:var(--accent);color:#3a2718;min-height:48px;cursor:pointer}
.gate-card .err{color:var(--rose);font-size:14px;min-height:1.3em;margin:0 0 10px}
@media(max-width:700px){
  main{padding:12px 12px 24px}
  h1{font-size:clamp(24px,7vw,34px);letter-spacing:.06em}
  .clock time{font-size:18px}
  .chip{font-size:13px;padding:5px 10px}
  .event-text,.empty{font-size:15px;line-height:1.55}
  .event-meta{font-size:12px}
  .crew button{font-size:13px;padding:8px 10px;min-height:40px}
  #feed{max-height:none}
  .nametag{font-size:11px}
  .bubble{font-size:12px;max-width:min(220px,70%)}
}
</style>
</head>
<body>
<div id="gate">
  <form class="gate-card" id="gate-form" autocomplete="on">
    <h1>欽天咖啡廳</h1>
    <p>這是私人頁面，請輸入密碼後查看員工動態。</p>
    <label for="gate-pass">密碼</label>
    <input id="gate-pass" name="password" type="password" autocomplete="current-password" inputmode="text" required>
    <p class="err" id="gate-err" role="alert"></p>
    <button type="submit">進入咖啡廳</button>
  </form>
</div>
<div id="app" hidden>
<main>
<header>
  <div><h1>欽天咖啡廳</h1><div class="flags" id="flags"><span class="chip">等候動態更新</span></div></div>
  <div class="clock">台北 <time id="clock"></time></div>
</header>
<div class="layout">
  <section aria-label="咖啡廳與店員">
    <div class="frame"><div class="scene">
      <canvas id="room" width="456" height="300" aria-label="像素咖啡廳"></canvas>
      <div class="chalk" aria-hidden="true">欽天咖啡廳</div>
      <div class="targets" id="targets"></div>
    </div></div>
    <nav class="crew" id="crew" aria-label="七位店員"></nav>
    <p id="selection" hidden></p>
  </section>
  <aside class="panel" aria-labelledby="feed-title">
    <div class="panel-head"><h2 id="feed-title">即時動態</h2><span class="snapshot" id="snapshot"></span></div>
    <p id="notice" role="status" hidden>動態暫時連不上，稍後再試</p>
    <ol id="feed"><li class="empty">等候第一筆動態</li></ol>
  </aside>
</div>
</main>
</div>

function focus(){

  c.bubble=document.createElement("div");c.bubble.className="bubble";c.bubble.setAttribute("aria-hidden","true");
  $("targets").append(c.button,c.bubble);$("crew").append(c.legend);
  for(const button of [c.button,c.legend]){
    button.addEventListener("click",()=>toggle(c.id));
    button.addEventListener("pointerenter",e=>{if(e.pointerType==="mouse"){hovered=c.id;focus();}});
    button.addEventListener("pointerleave",()=>{hovered=null;focus();});
    button.addEventListener("focus",()=>{hovered=c.id;focus();});
    button.addEventListener("blur",()=>{hovered=null;focus();});
  }
}
function tick(now){
  const elapsed=Math.min(now-previous,50);previous=now;
  const frame=Math.floor(now/170)%2;
  paint=ctx;ctx.drawImage(background,0,0);
  for(const c of crew.slice().sort((a,b)=>a.y-b.y)){
    const dist=Math.hypot(c.tx-c.x,c.ty-c.y);
    const walking=dist>0.5;
    const step=walking && !reduced.matches ? Math.min(1,elapsed*.055/dist) : 1;
    c.x+=(c.tx-c.x)*step;c.y+=(c.ty-c.y)*step;
    sprite(c,walking && !reduced.matches,reduced.matches?0:frame);
    c.button.style.left=c.x/4.56+"%";c.button.style.top=c.y/3+"%";
    const bx=Math.min(350,Math.max(106,c.x));
    c.bubble.style.setProperty("--x",bx/4.56+"%");
    c.bubble.style.setProperty("--y",Math.max(42,c.y-24)/3+"%");
    c.bubble.style.setProperty("--tip",50+(c.x-bx)*.3+"%");
  }
  requestAnimationFrame(tick);
}
function chip(message,kind=""){
  const span=document.createElement("span");span.className="chip "+kind;span.textContent=message;return span;
}
function update(next){
  const redraw=!status || status.night_mode!==next.night_mode;
  status=next;
  document.body.classList.toggle("night",status.night_mode);
  if(redraw)drawRoom(status.night_mode);
  $("flags").replaceChildren(chip(status.shop_status,status.night_mode?"":"open"));
  if(status.flags.dashboard_forbidden)$("flags").append(chip("蝦皮驗證暫停產連結","alert"));
  $("flags").append(chip("缺連結商品 "+status.flags.missing_products+" 項"));
  $("snapshot").textContent="更新 "+timeOnly.format(new Date(status.updated_at));
  const used={};
  for(const c of crew){
    c.data=status.agents.find(a=>a.id===c.id);
    if(!c.data) continue;
    const key=c.data.spot;
    const positions=spots[key] || spots.table;
    const index=used[key] || 0;
    [c.tx,c.ty]=positions[index%positions.length];
    if(index>=positions.length)c.ty+=20;
    used[key]=index+1;
    c.bubble.textContent=c.data.thought;
    c.button.setAttribute("aria-label",c.name+"，"+labels[c.data.status]+"，"+c.data.thought);
  }
  const feed=$("feed");
  const scroll=feed.scrollTop;
  feed.replaceChildren();
  for(const event of status.feed){
    const li=document.createElement("li");
    li.dataset.id=crew.find(c=>c.name===event.agent)?.id || "";
    li.classList.toggle("mark",li.dataset.id===pinned);
    const meta=document.createElement("div");meta.className="event-meta";
    const time=document.createElement("time");time.dateTime=event.t;time.textContent=timeOnly.format(new Date(event.t));
    const agent=document.createElement("strong");agent.textContent=event.agent;
    const message=document.createElement("p");message.className="event-text";message.textContent=event.text;
    meta.append(time,agent);li.append(meta,message);feed.append(li);
  }
  if(!feed.children.length){
    const li=document.createElement("li");li.className="empty";li.textContent="近期還沒有動態";feed.append(li);
  }
  feed.scrollTop=scroll;
  focus();
}
async function decryptStatus(bundle, password){
  if(!bundle||bundle.v!==1||bundle.kdf!=="PBKDF2"||!bundle.salt||!bundle.iv||!bundle.ct)throw new Error("bad bundle");
  const enc=new TextEncoder();
  const dec=new TextDecoder();
  const fromB64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
  const material=await crypto.subtle.importKey("raw",enc.encode(password),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey(
    {name:"PBKDF2",salt:fromB64(bundle.salt),iterations:bundle.iter,hash:bundle.hash||"SHA-256"},
    material,
    {name:"AES-GCM",length:256},
    false,
    ["decrypt"]
  );
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:fromB64(bundle.iv)},key,fromB64(bundle.ct));
  return JSON.parse(dec.decode(pt));
}
let cafePassword=null;
async function poll(){
  if(!cafePassword)return;
  const controller=new AbortController();
  const timer=setTimeout(()=>controller.abort(),8000);
  try{
    const response=await fetch("status.enc.json?t="+Date.now(),{cache:"no-store",signal:controller.signal});
    if(!response.ok)throw new Error("status unavailable");
    const bundle=await response.json();
    const snapshot=await decryptStatus(bundle,cafePassword);
    if(!Array.isArray(snapshot.agents)||!Array.isArray(snapshot.feed)||!snapshot.flags||!Number.isFinite(Date.parse(snapshot.updated_at)))throw new Error("invalid status");
    if(snapshot.updated_at!==status?.updated_at)update(snapshot);
    $("notice").hidden=true;
  } catch {
    $("notice").hidden=false;
  } finally {
    clearTimeout(timer);
  }
}
function clock(){const el=$("clock"); if(el) el.textContent=timeOnly.format(new Date());}
function startCafe(){
  $("gate").hidden=true;
  $("app").hidden=false;
  drawRoom(false);focus();clock();poll();
  setInterval(clock,1000);setInterval(poll,10000);
  requestAnimationFrame(tick);
}
$("gate-form").addEventListener("submit",async event=>{
  event.preventDefault();
  const err=$("gate-err");
  const password=$("gate-pass").value;
  err.textContent="";
  if(!password){err.textContent="請輸入密碼";return;}
  try{
    const response=await fetch("status.enc.json?t="+Date.now(),{cache:"no-store"});
    if(!response.ok)throw new Error("status unavailable");
    const bundle=await response.json();
    const snapshot=await decryptStatus(bundle,password);
    if(!Array.isArray(snapshot.agents)||!Array.isArray(snapshot.feed)||!snapshot.flags||!Number.isFinite(Date.parse(snapshot.updated_at)))throw new Error("invalid status");
    cafePassword=password;
    $("gate-pass").value="";
    startCafe();
    update(snapshot);
  } catch {
    err.textContent="密碼不對，請再試一次";
    $("gate-pass").focus();
    $("gate-pass").select();
  }
});
document.addEventListener("keydown",event=>{if(event.key==="Escape"){hovered=null;if(pinned)toggle(pinned);else focus();}});
</script>
